name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch dependency drift before it reaches a laptop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[chart,dev]"

      - name: Lint
        run: ruff check espero tests research

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Reproduce the audit table
        run: espero matrix

      - name: CLI smoke test
        run: |
          espero --version
          espero backtest --fee-bps 60
          espero daily --dry-run --state-dir /tmp/espero-ci
